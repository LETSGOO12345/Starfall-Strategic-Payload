
name: Build Starfall Overhaul

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o Starfall-Strategic-Payload-Forge-1.20.1.zip -d project

      - name: Fix PartPose import
        run: |
          sed -i '/import net.minecraft.client.model.geom.ModelPart;/a import net.minecraft.client.model.geom.PartPose;' project/src/main/java/com/starfall/overhaul/client/NukeModel.java

      - name: Build mod
        run: |
          cd project
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Starfall-Overhaul-JAR
          path: project/build/libs/*.jar
          
