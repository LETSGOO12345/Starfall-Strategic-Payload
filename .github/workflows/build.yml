
name: Build Starfall Overhaul

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o Starfall-Strategic-Payload-Forge-1.20.1.zip -d project

      - name: Build
        run: cd project && gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: Starfall-Overhaul-JAR
          path: project/build/libs/*.jar
          
